apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: freshrss-postgresql
spec:
  instances: 1
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: freshrss
      owner: freshrss
      # Trigram indexes speed up FreshRSS title/content search (see README for the index step).
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
