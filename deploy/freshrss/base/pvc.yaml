# Holds FreshRSS config, cache, and (without the CNPG component) the SQLite database.
# Uses the cluster's default StorageClass; set storageClassName in the application repo if needed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freshrss-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
